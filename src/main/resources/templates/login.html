<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="auth container">
    <div class="auth-card">
        <h1>Willkommen zurück</h1>
        <p class="subtitle">Melde dich an, um weiterzushoppen.</p>
        <div th:if="${param.error}" class="alert alert-error">Falsche E-Mail oder Passwort.</div>
        <div th:if="${param.logout}" class="alert alert-info">Du wurdest ausgeloggt.</div>
        <div th:if="${param.registered}" class="alert alert-success">Registrierung erfolgreich. Bitte melde dich jetzt an.</div>
        <form method="post" th:action="@{/login}">
            <div class="field">
                <label for="username">E-Mail</label>
                <input type="email" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Passwort</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-block">Einloggen</button>
        </form>
        <p class="subtitle">oder</p>
        <button type="button" id="passkey-signin" class="btn btn-block"
                th:data-csrf-header="${_csrf.headerName}" th:data-csrf-token="${_csrf.token}"
                th:data-context-path="@{/}">Mit Passkey einloggen</button>
        <p class="auth-footer">
            Noch kein Konto? <a th:href="@{/register}">Jetzt registrieren</a>
        </p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<!-- Client-Skript liefert Spring Security selbst aus (DefaultResourcesFilter) -->
<script th:src="@{/login/webauthn.js}"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const button = document.getElementById('passkey-signin');
        const csrfHeaders = { [button.dataset.csrfHeader]: button.dataset.csrfToken };
        const contextPath = button.dataset.contextPath.replace(/\/$/, '');
        setupLogin(csrfHeaders, contextPath, button);
    });
</script>
</body>
</html>
