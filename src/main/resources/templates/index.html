<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Shop')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <section class="hero container">
        <span class="eyebrow">// neue Kollektion</span>
        <h1>Shirts für Leute, die <em>Code</em> tragen.</h1>
        <p>Tees und Hoodies mit Geek- und Gamer-Flair. Gedruckt in Pixeln, getragen mit Stolz.</p>
    </section>
    <section class="container">
        <div class="section-title">
            <h2>Alle Produkte</h2>
            <span th:text="${#lists.size(products)} + ' Artikel'">8 Artikel</span>
        </div>
        <div class="grid">
            <a class="product-card" th:each="product : ${products}" th:href="@{/products/{id}(id=${product.id})}">
                <img th:if="${product.imageUrl}" th:src="@{${product.imageUrl}}" th:alt="${product.name}">
                <div class="product-card-body">
                    <h3 th:text="${product.name}">Produktname</h3>
                    <p th:text="${product.description}">Beschreibung</p>
                    <span class="price" th:text="${#numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')} + ' €'">19,99 €</span>
                </div>
            </a>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
