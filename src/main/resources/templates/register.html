<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrieren')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="auth container">
    <div class="auth-card">
        <h1>Konto erstellen</h1>
        <p class="subtitle">Ein Konto, alle Nerdshirts.</p>
        <form th:action="@{/register}" method="post" th:object="${registrationForm}">
            <div class="field">
                <label for="email">E-Mail</label>
                <input type="email" id="email" th:field="*{email}" autocomplete="username" required>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="field">
                <label for="password">Passwort</label>
                <input type="password" id="password" th:field="*{password}" autocomplete="new-password" required>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="field">
                <label for="confirmPassword">Passwort wiederholen</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" autocomplete="new-password" required>
                <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>
            <button type="submit" class="btn btn-accent btn-block">Registrieren</button>
        </form>
        <p class="auth-footer">
            Bereits registriert? <a th:href="@{/login}">Zum Login</a>
        </p>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
