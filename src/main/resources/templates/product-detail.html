<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${product.name})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <section class="detail">
        <img th:if="${product.imageUrl}" th:src="@{${product.imageUrl}}" th:alt="${product.name}">
        <div>
            <span class="eyebrow">// nerdshirts original</span>
            <h1 th:text="${product.name}">Produktname</h1>
            <p class="lead" th:text="${product.description}">Beschreibung</p>
            <span class="price" th:text="${#numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')} + ' €'">19,99 €</span>
            <ul class="facts">
                <li>100 % Bio-Baumwolle</li>
                <li>Unisex</li>
                <li>Siebdruck</li>
            </ul>
            <a class="back-link" th:href="@{/}">&larr; Zurück zur Übersicht</a>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
