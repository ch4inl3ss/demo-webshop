<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container account">
    <span class="eyebrow">// admin</span>
    <h1>Admin-Bereich</h1>
    <p class="lead">Nur mit der Rolle <code>ADMIN</code> aus Keycloak. Das ID-Token sagt uns, wer sich wann angemeldet hat.</p>

    <ul class="passkey-list">
        <li class="passkey">
            <div class="passkey-info">
                <strong th:text="${user.fullName}">Ada Admin</strong>
                <div class="passkey-meta" th:text="${user.email} + ' · Rollen: ' + ${user.getClaimAsStringList('roles')}">admin@nerdshirts.de</div>
            </div>
        </li>
        <li class="passkey">
            <div class="passkey-info">
                <strong>Anmeldung bei Keycloak</strong>
                <div class="passkey-meta" th:text="${#temporals.format(authTime, 'dd.MM.yyyy, HH:mm:ss')} + ' · Issuer: ' + ${user.issuer}">angemeldet</div>
            </div>
        </li>
    </ul>

    <ul class="passkey-list">
        <li class="passkey" th:each="product : ${products}">
            <div class="passkey-info">
                <strong th:text="${product.name}">Produkt</strong>
                <div class="passkey-meta" th:text="${#numbers.formatDecimal(product.price, 1, 'POINT', 2, 'COMMA')} + ' €'">19,99 €</div>
            </div>
        </li>
    </ul>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
