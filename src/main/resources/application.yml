spring:
  # Passkeys müssen einen Neustart überleben: lokal gegen die Postgres aus docker compose (docker compose up db)
  datasource:
    url: jdbc:postgresql://localhost:5432/webshop
    driverClassName: org.postgresql.Driver
    username: webshop
    password: webshop
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  # Bestehende Datenbanken (Volume aus Teil 1) haben schon Tabellen, aber noch keine Flyway-Historie
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  # Der Shop ist OIDC-Client von Keycloak (docker compose up keycloak), Realm siehe keycloak/nerdshirts-realm.json
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: nerdshirts
            client-secret: ${KEYCLOAK_CLIENT_SECRET:nerdshirts-demo-secret}
            scope: openid, profile, email
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/nerdshirts
            user-name-attribute: email
# Hinter einem TLS-Proxy/Tunnel: X-Forwarded-* auswerten, damit Redirects auf https zeigen
server:
  forward-headers-strategy: framework
nerdshirts:
  keycloak:
    # Passkeys verwaltet jetzt Keycloak: Account-Konsole, Bereich "Anmeldung"
    account-url: http://localhost:8180/realms/nerdshirts/account/account-security/signing-in
logging:
  level:
    org.springframework.security: INFO
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://db:5432/webshop
    driverClassName: org.postgresql.Driver
    username: webshop
    password: webshop
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
