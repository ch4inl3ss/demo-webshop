spring:
  # Passkeys müssen einen Neustart überleben: lokal gegen die Postgres aus docker compose (docker compose up db)
  datasource:
    url: jdbc:postgresql://localhost:5432/webshop
    driverClassName: org.postgresql.Driver
    username: webshop
    password: webshop
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  # Bestehende Datenbanken (Volume aus Teil 1) haben schon Tabellen, aber noch keine Flyway-Historie
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
logging:
  level:
    org.springframework.security: INFO
---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://db:5432/webshop
    driverClassName: org.postgresql.Driver
    username: webshop
    password: webshop
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
